name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.2)'
        required: false
      only_windows:
        description: 'Nur Windows bauen (Signier-Testlauf, kein Release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    # Gepinnt auf macOS 15 (Sequoia), NICHT macos-latest: Seit dem Runner-Image
    # macos-26 Version 20260831 (macOS 26.6) schlägt electron-builders temporäre
    # Signier-Keychain fehl — `security set-key-partition-list` meldet
    # "SecKeychainUnlock: The user name or passphrase you entered is not correct"
    # für beide Architekturen (v0.11.5-beta, zwei Anläufe). Apple hat das
    # Entsperren von Keychains außerhalb einer Login-Session in 26.6 gehärtet;
    # auf GitHub-Runnern ist das nicht beeinflussbar. Image 20260728 lief noch.
    # Bei manuellem Start mit only_windows=true übersprungen (Signier-Testlauf spart 2× macOS-Runner).
    if: ${{ !inputs.only_windows }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build app
        working-directory: app
        run: npm run build

      - name: Prepare Apple API Key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Build and sign macOS (${{ matrix.arch }})
        working-directory: app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      # Fängt eine ungültige Code-Signatur (z.B. Unicode-Dateinamen, die das Bundle-Siegel
      # brechen → "a sealed resource is missing or invalid") SOFORT ab, mit der exakten Datei —
      # statt erst Minuten später an Apples "Invalid"-Notarisierung zu scheitern.
      - name: Verify code signature
        working-directory: app
        run: |
          set -euo pipefail
          APP=$(ls -d dist/mac*/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "::error::Keine .app zum Verifizieren gefunden"; exit 1; fi
          echo "Verifiziere Signatur: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Signatur OK"

      # Kein continue-on-error mehr: schlägt die Notarisierung fehl, FÄLLT das Release —
      # damit nie wieder ein nicht-notarisiertes ("beschädigtes") DMG ausgeliefert wird.
      - name: Notarize macOS app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -uo pipefail
          DMG_FILE=$(ls app/dist/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG_FILE" ]; then echo "::error::Kein DMG zum Notarisieren gefunden"; exit 1; fi
          KEY="$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "Notarizing: $DMG_FILE"
          for attempt in 1 2; do
            OUT=$(xcrun notarytool submit "$DMG_FILE" \
              --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --wait --timeout 30m 2>&1) || true
            echo "$OUT"
            if echo "$OUT" | grep -q "status: Accepted"; then
              echo "Stapling..."
              xcrun stapler staple "$DMG_FILE"
              xcrun stapler validate "$DMG_FILE"
              echo "Notarisierung + Stapling erfolgreich."
              exit 0
            fi
            echo "::warning::Notarisierungs-Versuch $attempt nicht 'Accepted'"
            sleep 30
          done
          echo "::error::Notarisierung fehlgeschlagen (nicht 'Accepted') — Release wird abgebrochen."
          exit 1

      - name: Cleanup Apple API Key
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_"*.p8

      # yml (latest-mac.yml) ist identisch zwischen x64/arm64 → nur von arm64 uploaden
      # um doppelte Uploads im release-Step (GitHub API 404 bei Duplikaten) zu vermeiden
      - name: Upload macOS artifacts (arm64 incl. yml)
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.yml
            app/dist/*.blockmap
          if-no-files-found: error

      - name: Upload macOS artifacts (x64 without yml)
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.blockmap
          if-no-files-found: error

  build-linux:
    if: ${{ !inputs.only_windows }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build app
        working-directory: app
        run: npm run build

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build Linux (x64 + arm64)
        working-directory: app
        run: |
          npx electron-builder --linux AppImage deb --x64 --arm64 --publish never
          npx electron-builder --linux snap --x64 --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.snap
            app/dist/*.yml
            app/dist/*.blockmap
          if-no-files-found: error

      - name: Publish to Snap Store
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          for SNAP_FILE in app/dist/*.snap; do
            echo "Publishing: $SNAP_FILE"
            snapcraft upload "$SNAP_FILE" --release=edge
          done

  build-windows:
    # windows-latest wurde auf VS 2026 umgestellt → node-gyp (für node-pty-Rebuild) findet
    # die VS-Installation nicht mehr ("Could not find any Visual Studio installation").
    # windows-2022 (VS 2022) ist die bekannt-funktionierende Umgebung (v0.7.26 lief damit durch).
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # Certum SimplySign Desktop: der Signierschlüssel liegt in Certums Cloud-HSM, die Desktop-App
      # stellt ihn als Smartcard-Zertifikat im Windows-Zertifikatsspeicher bereit. Version ist
      # GEPINNT, weil die Anmeldung (dismine-Action) das Login-Fenster per Tastatur bedient — ein
      # geändertes Fenster in einer neueren Version bricht sie. Neue Version nur nach Testlauf.
      SIMPLYSIGN_URL: https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.3.90/SimplySignDesktop-9.4.3.90-64-bit-en.msi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build app
        working-directory: app
        run: npm run build

      # Ohne die drei Certum-Secrets (Fork-PRs, Dependabot) wird unsigniert gebaut — aber NIE für ein
      # Release: ein Tag-Build ohne Secrets bricht ab, damit nie wieder eine unsignierte Exe auf der
      # Release-Seite landet (analog zur Notarisierungspflicht beim Mac).
      - name: Code Signing vorbereiten
        id: signing
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          $missing = @('CERTUM_USERNAME', 'CERTUM_OTP_URI', 'CERTUM_KEY_ID') |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -eq 0) {
            Write-Host "Code Signing: aktiv (Certum SimplySign)"
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            Write-Error "Release-Build ohne Certum-Secrets ($($missing -join ', ')) — ein Windows-Release darf nicht unsigniert erscheinen."
            exit 1
          } else {
            Write-Host "Code Signing: übersprungen — Secrets fehlen ($($missing -join ', ')), kein Tag-Build"
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: SimplySign-Installer cachen (274 MB)
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: SimplySignDesktop.msi
          key: simplysign-msi-${{ env.SIMPLYSIGN_URL }}

      # Installiert SimplySign Desktop, erzeugt aus dem TOTP-Geheimnis den Einmalcode, meldet sich im
      # Login-Fenster an und wartet, bis das Zertifikat mit dem Thumbprint CERTUM_KEY_ID im Speicher
      # CurrentUser\My liegt. Auf den Commit gepinnt, nicht auf den Tag v1.2.5: die Action sieht das
      # TOTP-Geheimnis, ein umgehängter Tag darf es nicht abgreifen können. Quelle am 17.09.2026
      # vollständig gelesen (MIT-Lizenz): Secrets bleiben in Env/Zwischenablage, Zwischenablage wird
      # nach dem Einfügen geleert, keine Screenshots ohne capture-diagnostics.
      - name: Bei Certum SimplySign anmelden (TOTP)
        if: steps.signing.outputs.enabled == 'true'
        uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64 # v1.2.5
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ secrets.CERTUM_KEY_ID }}
          simplysign-url: ${{ env.SIMPLYSIGN_URL }}

      # electron-builder signiert damit alles selbst: App-Exe, gebündelte DLLs, Uninstaller, NSIS-Setup
      # und portable Exe (signtool /sha1 <Thumbprint> /s My, SHA-256, RFC-3161-Zeitstempel bei Certum —
      # siehe win.signtoolOptions in app/package.json). Der Thumbprint kommt NUR hier über die
      # Kommandozeile, nie in die package.json: ein lokales `npm run dist` auf Windows ohne Zertifikat
      # soll weiterhin unsigniert durchlaufen. Fehlt das Zertifikat im Speicher, bricht der Build ab
      # ("Cannot find certificate") — es gibt keinen stillen Rückfall auf unsigniert.
      - name: Build Windows (x64, signiert)
        if: steps.signing.outputs.enabled == 'true'
        working-directory: app
        shell: pwsh
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: npx electron-builder --win --x64 --publish never --config.win.signtoolOptions.certificateSha1=$env:CERTUM_KEY_ID

      - name: Build Windows (x64, unsigniert)
        if: steps.signing.outputs.enabled != 'true'
        working-directory: app
        run: npx electron-builder --win --x64 --publish never

      # Fängt SOFORT ab, was sonst erst beim Nutzer auffiele: (1) Status muss "Valid" sein (Kette bis
      # zur vertrauenswürdigen Wurzel), (2) der Herausgeber (CN) muss exakt dem publisherName aus
      # package.json entsprechen — genau der Vergleich, den electron-updater vor jedem Update macht;
      # ein abweichender CN hieße, dass jede künftige Version vom Auto-Update abgelehnt wird —,
      # (3) ein Zeitstempel muss vorhanden sein, sonst wird die Signatur mit dem Zertifikat ungültig.
      - name: Signaturen prüfen
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $expected = (Get-Content app/package.json -Raw | ConvertFrom-Json).build.win.signtoolOptions.publisherName
          if ([string]::IsNullOrWhiteSpace($expected)) { Write-Error "build.win.signtoolOptions.publisherName fehlt in app/package.json"; exit 1 }

          $files = @(Get-ChildItem -Path app/dist/*.exe) + @(Get-ChildItem -LiteralPath 'app/dist/win-unpacked/MindGraph Notes.exe')
          if ($files.Count -lt 3) { Write-Error "Erwartet mindestens Setup, portable Exe und App-Exe, gefunden: $($files.Count)"; exit 1 }

          $failed = $false
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            $cn = if ($sig.SignerCertificate) { $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
            $ts = if ($sig.TimeStamperCertificate) { 'ja' } else { 'NEIN' }
            Write-Host "$($f.Name): Status=$($sig.Status) CN='$cn' Zeitstempel=$ts"
            if ($sig.Status -ne 'Valid') { Write-Host "::error::$($f.Name): Signatur nicht gültig ($($sig.Status)): $($sig.StatusMessage)"; $failed = $true }
            if ($cn -ne $expected) { Write-Host "::error::$($f.Name): Herausgeber '$cn' ≠ publisherName '$expected' — Auto-Update würde Updates ablehnen"; $failed = $true }
            if (-not $sig.TimeStamperCertificate) { Write-Host "::error::$($f.Name): kein Zeitstempel"; $failed = $true }
          }
          if ($failed) { exit 1 }
          Write-Host "Alle Signaturen OK"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            app/dist/*.exe
            app/dist/*.msi
            app/dist/*.yml
            app/dist/*.blockmap
          if-no-files-found: warn

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*" | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.snap
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/latest*.yml
            artifacts/**/*.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
